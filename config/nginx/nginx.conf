events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zone: 10MB memory, 50 requests/minute
    limit_req_zone $binary_remote_addr zone=warden_ip_limit:10m rate=50r/m;
    limit_req_status 429;

    # Upstream Definitions
    upstream orchestrator_backend {
        server warden-orchestrator:8000;
        keepalive 32;
    }

    upstream ingestion_backend {
        server warden-ingestion:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Health Checks
        location /health {
            return 200 '{"status":"HEALTHY","gateway":"nginx-ingress","cluster_status":"OPERATIONAL"}';
            add_header Content-Type application/json;
        }

        location /healthz {
            return 200 '{"status":"HEALTHY","gateway":"nginx-ingress"}';
            add_header Content-Type application/json;
        }

        # Query Synchronous Endpoint
        location /query {
            limit_req zone=warden_ip_limit burst=10 nodelay;

            # Role Validation
            if ($http_x_user_role = "") {
                return 401 '{"type":"https://warden.enterprise/errors/auth-role-missing","title":"Unauthorized","status":401,"detail":"Mandatory X-User-Role header is missing","instance":"/query","error_code":"ERR_AUTH_ROLE_MISSING","timestamp":"2026-09-28T00:00:00Z"}';
            }
            if ($http_x_user_role !~* ^(Employee|Manager|HR-Admin)$) {
                return 403 '{"type":"https://warden.enterprise/errors/auth-role-invalid","title":"Forbidden","status":403,"detail":"Invalid X-User-Role specified","instance":"/query","error_code":"ERR_AUTH_ROLE_INVALID","timestamp":"2026-09-28T00:00:00Z"}';
            }

            proxy_pass http://orchestrator_backend/query;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Role $http_x_user_role;
            proxy_http_version 1.1;
        }

        # Query Streaming Endpoint (SSE)
        location /query/stream {
            limit_req zone=warden_ip_limit burst=10 nodelay;

            # Role Validation
            if ($http_x_user_role = "") {
                return 401 '{"type":"https://warden.enterprise/errors/auth-role-missing","title":"Unauthorized","status":401,"detail":"Mandatory X-User-Role header is missing","instance":"/query/stream","error_code":"ERR_AUTH_ROLE_MISSING","timestamp":"2026-09-28T00:00:00Z"}';
            }
            if ($http_x_user_role !~* ^(Employee|Manager|HR-Admin)$) {
                return 403 '{"type":"https://warden.enterprise/errors/auth-role-invalid","title":"Forbidden","status":403,"detail":"Invalid X-User-Role specified","instance":"/query/stream","error_code":"ERR_AUTH_ROLE_INVALID","timestamp":"2026-09-28T00:00:00Z"}';
            }

            proxy_pass http://orchestrator_backend/query/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Role $http_x_user_role;
            proxy_set_header Connection '';

            # Mandatory Server-Sent Events (SSE) Directives
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
        }

        # Ingestion Endpoints
        location /ingest/run {
            proxy_pass http://ingestion_backend/ingest/run;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location ~ ^/ingest/status/(.*)$ {
            proxy_pass http://ingestion_backend/ingest/status/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
