# config/nginx/rate-limiting.conf
# Distributed IP-Based Rate Limiting Configuration

# 10MB memory zone tracking client IP addresses, enforcing 50 requests per minute
limit_req_zone $binary_remote_addr zone=warden_ip_limit:10m rate=50r/m;

# Reject rate-limited requests with HTTP 429 Too Many Requests
limit_req_status 429;

# Burst allowance of 10 requests with immediate non-delayed processing
limit_req zone=warden_ip_limit burst=10 nodelay;
