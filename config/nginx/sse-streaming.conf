# config/nginx/sse-streaming.conf
# Low-Latency Server-Sent Events (SSE) Proxy Configuration

# Disable proxy buffering to prevent packet chunk staging delays
proxy_buffering off;

# Disable proxy caching on dynamic streaming responses
proxy_cache off;

# Disable chunked transfer encoding to allow immediate packet flush
chunked_transfer_encoding off;

# Extend read and send timeouts to accommodate long-running LLM generation streams
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# Clear Connection header and enforce HTTP/1.1 for persistent upstream SSE stream
proxy_set_header Connection '';
proxy_http_version 1.1;
